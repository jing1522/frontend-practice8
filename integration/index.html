<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>校园公共信息与数据展示中心</title>
        <link href="libs/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <nav class ="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#home">校园信息中心</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="切换导航">
                    <span class="navbar-toggler-icon"></span>
                </button>
                 <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#self-study">自习室</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#stats">统计</a>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#three-d">校园3D</a>
                    </li>
                </ul>
            </div>
            </div>
           
        </nav>
              <main class="container my-4">
        <h1 class="text-center my-4">校园公共信息与数据展示中心</h1>
        <div id="home" class="row row-cols-1 row-cols-md-2 g-4">
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">自习室查询</h5>
                        <p class="card-text">按楼层、开放状态筛选自习室。</p>
                        <a href="#self-study" class="btn btn-secondary mt-2">进入</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">使用统计</h5>
                        <p class="card-text">各自习室使用量图表。</p>
                        <a href="#stats" class="btn btn-secondary mt-2">进入</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">校园三维导览</h5>
                        <p class="card-text">三维场景入口。</p>
                        <a href="three-d/scene.html" class="btn btn-secondary mt-2">进入</a>
                    </div>
                </div>
            </div>
        </div>
         <section id="self-study" class="my-5">
            <h3>自习室查询</h3>
            <div class="row g-3 mb-3">
                <div class="col-12 col-md-4">
                    <label for="floor-filter" class="form-label">楼层</label>
                    <select id="floor-filter" class="form-select">
                        <option value="">全部楼层</option>
                        <option value="1">1 层</option>
                        <option value="2">2 层</option>
                        <option value="3">3 层</option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label for="open-filter" class="form-label">开放状态</label>
                    <select id="open-filter" class="form-select">
                        <option value="">全部状态</option>
                        <option value="open">开放中</option>
                        <option value="closed">已关闭</option>
                    </select>
                </div>
            </div>
            <p class="text-muted" id="room-count"></p>
            <ul class="list-group" id="room-list"></ul>
        </section>
        <section id="stats" class="my-5">
            <h3>使用统计</h3>
            <p class="text-danger" id="chart-status"></p>
            <div id="usage-chart" style="height: 360px;"></div>
        </section>

        <section id="three-d" class="my-5">
            <h3>校园三维</h3>
            <a href="three-d/scene.html" class="btn btn-primary">进入三维导览</a>
        </section>
       </main>
         <script src="libs/jquery-3.7.1.min.js"></script>
         <script src="libs/echarts.min.js"></script>
         <script src="libs/bootstrap.bundle.min.js"></script>
         <script src="js/app.js"></script>
    </body>
</html>
